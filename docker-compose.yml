services:
  ttsu:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: ttsu
    restart: unless-stopped
    ports:
      - '3080:80'

  ttsu-storage:
    build:
      context: ./apps/storage-server
      dockerfile: Dockerfile
    container_name: ttsu-storage
    restart: unless-stopped
    ports:
      - '3081:3001'
    volumes:
      # Legacy sync data (served by the file API).
      - ${TTSU_DATA_PATH:-./data}:/data
      # SQLite database and its nightly snapshots. Must not be inside TTSU_DATA_PATH.
      - ${TTSU_DB_PATH:-./db}:/db
      # Regenerable cache: metadata.db snapshots and cover thumbnails (~1 GB for 60k books).
      # Safe to exclude from backups. Must not be inside the Calibre root or TTSU_DATA_PATH.
      - ${TTSU_CACHE_PATH:-./cache}:/cache
      # Calibre libraries root (each subfolder with a metadata.db is a library), READ-ONLY.
      # Long syntax so Docker never creates a missing path near the libraries.
      - type: bind
        source: ${TTSU_CALIBRE_PATH:?TTSU_CALIBRE_PATH required (Calibre libraries root, e.g. /mnt/user/data/media/books)}
        target: /calibre
        read_only: true
        bind:
          create_host_path: false
      # Audiobooks root (WP15): audiobook folders and the subtitle archive (e.g. japanese/,
      # japanese-srt/). Audiobooks are linked and streamed, never copied. Writable since
      # WP15f for new files only: a merged .m4b next to its originals, and later
      # japanese-srt/_generated/ and japanese-generated/. Existing files are never changed.
      - type: bind
        source: ${TTSU_AUDIOBOOKS_PATH:?TTSU_AUDIOBOOKS_PATH required (audiobooks root, e.g. /mnt/user/data/media/audiobooks)}
        target: /audiobooks
        bind:
          create_host_path: false
    environment:
      - DATA_DIR=/data
      - DB_DIR=/db
      - PORT=3001
      # Comma-separated origins you open the reader from, e.g.
      # http://tower:3080,http://192.168.1.10:3080,http://100.64.0.1:3080
      - CORS_ORIGIN=${TTSU_CORS_ORIGINS:?TTSU_CORS_ORIGINS required (origins you open the reader from)}
      # Local time zone for the snapshot schedule.
      - TZ=${TZ:-UTC}
      - SNAPSHOT_TIME=${TTSU_SNAPSHOT_TIME:-03:00}
      - SNAPSHOT_KEEP=${TTSU_SNAPSHOT_KEEP:-7}
      # Calibre indexer. New libraries stay off until you set their language with the CLI.
      - CALIBRE_DIR=/calibre
      - CACHE_DIR=/cache
      - CALIBRE_POLL_SECONDS=${TTSU_CALIBRE_POLL_SECONDS:-60}
      - CALIBRE_SETTLE_SECONDS=${TTSU_CALIBRE_SETTLE_SECONDS:-30}
      - CALIBRE_SNAPSHOT_TIMEOUT_SECONDS=${TTSU_CALIBRE_SNAPSHOT_TIMEOUT_SECONDS:-600}
      - CALIBRE_MAX_MISSING_PERCENT=${TTSU_CALIBRE_MAX_MISSING_PERCENT:-20}
      - THUMB_CONCURRENCY=${TTSU_THUMB_CONCURRENCY:-1}
      - THUMB_PER_SECOND=${TTSU_THUMB_PER_SECOND:-8}
      - THUMB_BACKGROUND=${TTSU_THUMB_BACKGROUND:-true}
      # Character counts (WP3b): background pass in a low-priority counter process.
      - COUNT_BACKGROUND=${TTSU_COUNT_BACKGROUND:-true}
      - COUNT_CONCURRENCY=${TTSU_COUNT_CONCURRENCY:-1}
      - COUNT_PER_MINUTE=${TTSU_COUNT_PER_MINUTE:-0}
      - COUNT_TIMEOUT_SECONDS=${TTSU_COUNT_TIMEOUT_SECONDS:-120}
      # Uploads (WP7b): files go to DATA_DIR/.uploads (the data volume above).
      - UPLOAD_MAX_MB=${TTSU_UPLOAD_MAX_MB:-200}
      - UPLOAD_STAGED_HOURS=${TTSU_UPLOAD_STAGED_HOURS:-24}
      # Audiobooks (WP15). Each library gets its folders with the CLI:
      # cli library set <id> --audio-dir japanese --subtitle-dir japanese-srt
      - AUDIOBOOKS_DIR=/audiobooks
      - AUDIO_SCAN_HOURS=${TTSU_AUDIO_SCAN_HOURS:-24}
      # New files in the audiobooks folder get this owner and mode (Unraid: nobody:users,
      # rw for everyone, like files made over SMB, so they can be deleted from Windows).
      - AUDIOBOOKS_FILE_UID=${TTSU_AUDIOBOOKS_FILE_UID:-99}
      - AUDIOBOOKS_FILE_GID=${TTSU_AUDIOBOOKS_FILE_GID:-100}
      - AUDIOBOOKS_FILE_MODE=${TTSU_AUDIOBOOKS_FILE_MODE:-0666}

  # WP20a: the Calibre library cleanup's apply sidecar. The ONLY writer to Calibre: only
  # through the running content server (calibredb --with-library http://...), only for
  # cleanup batches applied from the reader's /cleanup page. Its token comes from
  #   docker exec ttsu-storage node dist/cli.js token cleanup "cleanup sidecar"
  # The Calibre address, library id, user and password are entered on /cleanup.
  ttsu-cleanup-apply:
    build:
      context: ./apps/cleanup-apply
      args:
        # Must be the calibre container's version (calibredb and the content server match).
        CALIBRE_TAG: ${TTSU_CALIBRE_TAG:-9.18.0}
    container_name: ttsu-cleanup-apply
    restart: unless-stopped
    # Unraid's nobody:users, like files made over SMB (the quarantine can be emptied from Windows).
    user: '${TTSU_CLEANUP_UID:-99}:${TTSU_CLEANUP_GID:-100}'
    depends_on:
      - ttsu-storage
    volumes:
      # Removed copies are exported here before Calibre removes them; nothing here is ever
      # deleted by the sidecar. The folder must exist (it is not created).
      - type: bind
        source: ${TTSU_QUARANTINE_PATH:-/mnt/user/data/backups/calibre-quarantine}
        target: /quarantine
        bind:
          create_host_path: false
    environment:
      - TTSU_URL=http://ttsu-storage:3001
      - CLEANUP_TOKEN=${TTSU_CLEANUP_TOKEN:-}
      - QUARANTINE_MIN_FREE_MB=${TTSU_QUARANTINE_MIN_FREE_MB:-2048}
